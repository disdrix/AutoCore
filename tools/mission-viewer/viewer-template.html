<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCore Mission Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1419;
      --panel: #171d25;
      --panel-2: #1f2731;
      --border: #2d3847;
      --text: #e8edf3;
      --muted: #9aa8b8;
      --accent: #5cc8ff;
      --accent-2: #7ee787;
      --warn: #f2cc60;
      --danger: #ff8b8b;
      --purple: #c4a1ff;
      --mono: "Cascadia Code", "Consolas", monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: linear-gradient(180deg, #0b1015 0%, var(--bg) 220px);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 1600px; margin: 0 auto; padding: 20px; }
    header { margin-bottom: 16px; }
    h1 { margin: 0 0 8px; font-size: 1.7rem; letter-spacing: 0.02em; }
    .subtitle { color: var(--muted); margin: 0; line-height: 1.5; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .pill strong { color: var(--text); font-weight: 600; }
    .toolbar {
      display: grid;
      grid-template-columns: 1.4fr 160px 150px 140px 120px 130px auto;
      gap: 10px;
      margin: 16px 0 12px;
      align-items: center;
    }
    input, select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 9px 11px;
    }
    input:focus, select:focus, button:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    button {
      cursor: pointer;
      background: #1a2430;
    }
    button.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      gap: 14px;
      min-height: 70vh;
    }
    .list-panel, .detail-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.25);
    }
    .list-panel { display: flex; flex-direction: column; max-height: calc(100vh - 220px); }
    .list-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      background: #121820;
    }
    .mission-list { overflow: auto; flex: 1; }
    .mission-row {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .mission-row:hover { background: rgba(92, 200, 255, 0.05); }
    .mission-row.selected { background: rgba(92, 200, 255, 0.12); border-left: 3px solid var(--accent); }
    .mission-row .title { font-weight: 600; color: #fff; margin-bottom: 4px; }
    .mission-row .meta-line {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      font-size: 0.8rem; color: var(--muted);
    }
    .chip {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.72rem;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      text-transform: lowercase;
    }
    .chip.patrol { color: var(--accent); border-color: rgba(92,200,255,.35); }
    .chip.kill, .chip.kill_aggregate { color: var(--danger); border-color: rgba(255,139,139,.35); }
    .chip.deliver { color: var(--accent-2); border-color: rgba(126,231,135,.35); }
    .chip.collect { color: var(--warn); border-color: rgba(242,204,96,.35); }
    .chip.useitem { color: var(--purple); border-color: rgba(196,161,255,.35); }
    .chip.core { color: var(--warn); border-color: rgba(242,204,96,.4); text-transform: none; }
    .id-mono { font-family: var(--mono); font-size: 0.78rem; }
    .detail-panel { padding: 0; max-height: calc(100vh - 220px); overflow: auto; }
    .detail-empty { padding: 48px; text-align: center; color: var(--muted); }
    .detail-inner { padding: 18px 20px 28px; }
    .detail-title { margin: 0 0 6px; font-size: 1.45rem; }
    .detail-sub { color: var(--muted); margin: 0 0 14px; font-family: var(--mono); font-size: 0.85rem; word-break: break-all; }
    .section { margin-top: 18px; }
    .section h3 {
      margin: 0 0 10px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
    }
    .grid-kv {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }
    .kv {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .kv .k { display: block; color: var(--muted); font-size: 0.75rem; margin-bottom: 3px; }
    .kv .v { font-weight: 600; word-break: break-word; }
    .story {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    .story .label {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .mk-imp { color: var(--warn); font-weight: 600; }
    .mk-loc { color: var(--accent); }
    .mk-npc { color: var(--accent-2); font-weight: 600; }
    .mk-emote { color: var(--purple); font-style: italic; }
    .mk-inst { letter-spacing: 0.04em; }
    .mk-token { color: var(--muted); font-family: var(--mono); font-size: 0.9em; }
    .flow { display: flex; flex-direction: column; gap: 12px; }
    .obj-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #141b23;
      overflow: hidden;
    }
    .obj-head {
      padding: 10px 12px;
      background: #121820;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .obj-seq {
      font-family: var(--mono);
      color: var(--accent);
      font-weight: 700;
      margin-right: 8px;
    }
    .obj-body { padding: 10px 12px 12px; }
    .obj-text { color: var(--muted); margin: 0 0 10px; line-height: 1.45; }
    .req-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: var(--panel-2);
    }
    .req-card:last-child { margin-bottom: 0; }
    .req-type {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .req-summary { font-weight: 600; margin-bottom: 6px; }
    .req-fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 6px;
      font-size: 0.85rem;
    }
    .req-fields .f .fk { color: var(--muted); margin-right: 4px; }
    .linkish {
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .dev-only { display: none; }
    body.dev .dev-only { display: block; }
    body.dev .dev-inline { display: inline; }
    .dev-inline { display: none; }
    .status { min-height: 22px; color: var(--muted); margin-bottom: 8px; font-size: 0.9rem; }
    .status.error { color: var(--danger); }
    .rewards-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .reward-pill {
      background: rgba(126,231,135,0.1);
      border: 1px solid rgba(126,231,135,0.25);
      color: var(--accent-2);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.85rem;
    }
    .summary-flow {
      background: rgba(92,200,255,0.08);
      border: 1px solid rgba(92,200,255,0.2);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--accent);
      line-height: 1.45;
    }
    @media (max-width: 1100px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
      .layout { grid-template-columns: 1fr; }
      .list-panel, .detail-panel { max-height: none; }
      .list-panel { max-height: 40vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>AutoCore Mission Viewer</h1>
      <p class="subtitle">
        Offline browser for Auto Assault missions — GLM narrative/requirements merged with WAD gates, givers, and rewards.
      </p>
      <div class="meta" id="meta"></div>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search title, ID, name, NPC, item, description...">
      <select id="reqFilter"><option value="">All requirements</option></select>
      <select id="typeFilter"><option value="">All types</option></select>
      <select id="coreFilter">
        <option value="">Core + side</option>
        <option value="core">Core only</option>
        <option value="side">Side only</option>
      </select>
      <select id="prereqFilter">
        <option value="">Any prereqs</option>
        <option value="yes">Has prereqs</option>
        <option value="no">No prereqs</option>
      </select>
      <input id="levelFilter" type="number" min="0" placeholder="Level ≥">
      <button id="devToggle" type="button" title="Show COIDs, slots, raw fields">Dev mode</button>
    </div>

    <div class="status" id="status">Loading missions...</div>

    <div class="layout">
      <div class="list-panel">
        <div class="list-header" id="listHeader">0 missions</div>
        <div class="mission-list" id="missionList"></div>
      </div>
      <div class="detail-panel" id="detailPanel">
        <div class="detail-empty">Select a mission to inspect its flow, gates, and requirements.</div>
      </div>
    </div>
  </div>

  <script>
    const EMBEDDED_DATA = {{MISSIONS_JSON}};

    const state = {
      doc: null,
      missions: [],
      filtered: [],
      selectedId: null,
      names: {},
      byId: new Map(),
      dev: false,
    };

    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const metaEl = $("meta");
    const listEl = $("missionList");
    const listHeaderEl = $("listHeader");
    const detailEl = $("detailPanel");
    const searchEl = $("search");
    const reqFilterEl = $("reqFilter");
    const typeFilterEl = $("typeFilter");
    const coreFilterEl = $("coreFilter");
    const prereqFilterEl = $("prereqFilter");
    const levelFilterEl = $("levelFilter");
    const devToggleEl = $("devToggle");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function nameOf(cbid) {
      if (cbid == null || cbid < 0) return null;
      const n = state.names[String(cbid)];
      return n ? (n.short || n.unique || null) : null;
    }

    function labelCbid(cbid, fallbackPrefix = "CBID") {
      if (cbid == null || cbid < 0) return "—";
      const n = nameOf(cbid);
      return n ? `${escapeHtml(n)} <span class="id-mono dev-inline">(${cbid})</span>` : `<span class="id-mono">${fallbackPrefix} ${cbid}</span>`;
    }

    function renderMarkup(text) {
      if (!text) return "";
      let s = escapeHtml(text);
      s = s.replace(/\[\$imp\]([\s\S]*?)\[\$\/imp\]/gi, '<span class="mk-imp">$1</span>');
      s = s.replace(/\[\$loc\]([\s\S]*?)\[\$\/loc\]/gi, '<span class="mk-loc">$1</span>');
      s = s.replace(/\[\$npc\]([\s\S]*?)\[\$\/npc\]/gi, '<span class="mk-npc">$1</span>');
      s = s.replace(/\[\$emote\]([\s\S]*?)\[\$\/emote\]/gi, '<span class="mk-emote">$1</span>');
      s = s.replace(/\[\$inst\]([\s\S]*?)\[\$\/inst\]/gi, '<span class="mk-inst">$1</span>');
      s = s.replace(/\[\$class\]/gi, '<span class="mk-token">[$class]</span>');
      s = s.replace(/\[\$name\]/gi, '<span class="mk-token">[$name]</span>');
      s = s.replace(/\[\$[a-zA-Z0-9_\/]+\]/g, (m) => `<span class="mk-token">${m}</span>`);
      return s;
    }

    function chipClass(t) {
      return `chip ${escapeHtml(t)}`;
    }

    function renderMeta(doc) {
      const when = doc.generatedAt ? new Date(doc.generatedAt).toLocaleString() : "unknown";
      metaEl.innerHTML = [
        `<span class="pill"><strong>${(doc.missionCount || 0).toLocaleString()}</strong> missions</span>`,
        `<span class="pill">WAD match <strong>${(doc.wadMatchCount || 0).toLocaleString()}</strong></span>`,
        `<span class="pill">Generated <strong>${escapeHtml(when)}</strong></span>`,
        doc.sourceGlm ? `<span class="pill">GLM <strong>${escapeHtml(doc.sourceGlm)}</strong></span>` : "",
      ].filter(Boolean).join("");
    }

    function populateFilters(missions) {
      const reqs = new Set();
      const types = new Set();
      for (const m of missions) {
        for (const t of (m.requirementTypes || [])) reqs.add(t);
        if (m.type) types.add(m.type);
      }
      for (const t of [...reqs].sort()) {
        const o = document.createElement("option");
        o.value = t;
        o.textContent = t;
        reqFilterEl.appendChild(o);
      }
      for (const t of [...types].sort()) {
        const o = document.createElement("option");
        o.value = t;
        o.textContent = t;
        typeFilterEl.appendChild(o);
      }
    }

    function haystack(m) {
      const parts = [
        m.id, m.title, m.name, m.internal, m.description, m.summaryFlow,
        m.npcGiverName, m.npcGiverCbid, m.continent,
        ...(m.requirementTypes || []),
      ];
      for (const obj of (m.objectives || [])) {
        parts.push(obj.title, obj.externalText, obj.name);
        for (const r of (obj.requirements || [])) {
          parts.push(r.type, r.summary, JSON.stringify(r));
        }
      }
      return parts.filter(Boolean).join(" ").toLowerCase();
    }

    function applyFilters() {
      const q = searchEl.value.trim().toLowerCase();
      const req = reqFilterEl.value;
      const typ = typeFilterEl.value;
      const core = coreFilterEl.value;
      const prereq = prereqFilterEl.value;
      const levelMin = levelFilterEl.value === "" ? null : Number(levelFilterEl.value);

      state.filtered = state.missions.filter((m) => {
        if (req && !(m.requirementTypes || []).includes(req)) return false;
        if (typ && m.type !== typ) return false;
        if (core === "core" && !m.coreMission) return false;
        if (core === "side" && m.coreMission) return false;
        const hasPrereq = (m.reqMissionIds && m.reqMissionIds.length) || (m.prerequisites && m.prerequisites.length);
        if (prereq === "yes" && !hasPrereq) return false;
        if (prereq === "no" && hasPrereq) return false;
        if (levelMin != null && !Number.isNaN(levelMin)) {
          const lo = m.reqLevelMin ?? 0;
          const hi = m.reqLevelMax ?? 9999;
          if (levelMin < lo || levelMin > hi) return false;
        }
        if (q && !haystack(m).includes(q)) return false;
        return true;
      });

      // Keep stable id order
      state.filtered.sort((a, b) => (a.id || 0) - (b.id || 0));
      renderList();
      listHeaderEl.textContent = `${state.filtered.length.toLocaleString()} shown / ${state.missions.length.toLocaleString()} total`;
      statusEl.textContent = "";
    }

    function renderList() {
      const frag = document.createDocumentFragment();
      // Cap DOM nodes for performance; still filter full set
      const maxRows = 500;
      const rows = state.filtered.slice(0, maxRows);
      for (const m of rows) {
        const div = document.createElement("div");
        div.className = "mission-row" + (m.id === state.selectedId ? " selected" : "");
        div.dataset.id = String(m.id);
        const chips = (m.requirementTypes || []).slice(0, 5).map((t) =>
          `<span class="${chipClass(t)}">${escapeHtml(t)}</span>`
        ).join("");
        div.innerHTML = `
          <div class="title">${escapeHtml(m.title || m.name || ("Mission " + m.id))}</div>
          <div class="meta-line">
            <span class="id-mono">#${m.id}</span>
            ${m.coreMission ? '<span class="chip core">core</span>' : ""}
            ${m.reqLevelMin != null ? `<span>Lv ${m.reqLevelMin}${m.reqLevelMax != null && m.reqLevelMax < 2000 ? "–" + m.reqLevelMax : "+"}</span>` : ""}
            ${chips}
          </div>`;
        div.addEventListener("click", () => selectMission(m.id));
        frag.appendChild(div);
      }
      if (state.filtered.length > maxRows) {
        const more = document.createElement("div");
        more.className = "detail-empty";
        more.style.padding = "16px";
        more.textContent = `Showing first ${maxRows} of ${state.filtered.length}. Refine search to narrow.`;
        frag.appendChild(more);
      }
      listEl.innerHTML = "";
      listEl.appendChild(frag);
    }

    function kv(k, v) {
      if (v == null || v === "" || v === false) return "";
      return `<div class="kv"><span class="k">${escapeHtml(k)}</span><span class="v">${v}</span></div>`;
    }

    function fieldGrid(obj, skip = new Set(["type", "slot", "summary", "raw"])) {
      const entries = Object.entries(obj || {}).filter(([k]) => !skip.has(k));
      if (!entries.length) return "";
      return `<div class="req-fields">${entries.map(([k, v]) => {
        let display = v;
        if (Array.isArray(v)) display = v.join(", ");
        else if (typeof v === "object") display = JSON.stringify(v);
        else if (typeof v === "boolean") display = v ? "yes" : "no";
        // Link mission ids
        if ((k === "missionIds" || k === "completedMission") && Array.isArray(v)) {
          display = v.map((id) => `<span class="linkish" data-goto="${id}">${id}</span>`).join(", ");
        } else if (k.toLowerCase().includes("cbid") || k === "npcTargetCbid" || k === "itemCbid" || k === "primaryCbid" || k === "secondaryCbid" || k === "targetCbid") {
          display = labelCbid(v);
        } else {
          display = escapeHtml(String(display));
        }
        return `<div class="f"><span class="fk">${escapeHtml(k)}:</span>${display}</div>`;
      }).join("")}</div>`;
    }

    function renderRequirement(req) {
      return `
        <div class="req-card">
          <div class="req-type">${escapeHtml(req.type || "?")}${req.slot != null ? ` · slot ${req.slot}` : ""}</div>
          <div class="req-summary">${escapeHtml(req.summary || req.type || "")}</div>
          ${fieldGrid(req)}
        </div>`;
    }

    function renderObjective(obj) {
      const rewards = [];
      if (obj.xp) rewards.push(`XP ${obj.xp}`);
      if (obj.credits) rewards.push(`Credits ${obj.credits}`);
      if (obj.attribPoints) rewards.push(`Attrib ${obj.attribPoints}`);
      if (obj.skillPoints) rewards.push(`Skill ${obj.skillPoints}`);
      const rewardHtml = rewards.length
        ? `<div class="rewards-row" style="margin-bottom:8px">${rewards.map((r) => `<span class="reward-pill">${escapeHtml(r)}</span>`).join("")}</div>`
        : "";
      const reqs = (obj.requirements || []).map(renderRequirement).join("") || '<div class="obj-text">No requirements on this objective.</div>';
      return `
        <div class="obj-card">
          <div class="obj-head">
            <div><span class="obj-seq">#${obj.sequence ?? "?"}</span><strong>${escapeHtml(obj.title || obj.name || "Objective")}</strong></div>
            <div class="id-mono dev-only">obj ${obj.objectiveId ?? "?"} · map ${escapeHtml(obj.map || obj.name || "")}</div>
          </div>
          <div class="obj-body">
            ${obj.externalText || obj.defaultText ? `<p class="obj-text">${renderMarkup(obj.externalText || obj.defaultText)}</p>` : ""}
            ${rewardHtml}
            ${obj.returnToNpc ? `<div class="obj-text">Return to NPC: ${labelCbid(obj.returnToNpc)}</div>` : ""}
            <div class="dev-only obj-text">
              WorldPosition=${obj.worldPosition ?? "—"} · ContinentObject=${obj.continentObject ?? "—"} · completeCount=${obj.completeCount ?? 0}
            </div>
            ${reqs}
          </div>
        </div>`;
    }

    function selectMission(id, pushHash = true) {
      const m = state.byId.get(Number(id));
      if (!m) {
        statusEl.textContent = `Mission ${id} not found`;
        statusEl.classList.add("error");
        return;
      }
      statusEl.classList.remove("error");
      state.selectedId = m.id;
      if (pushHash) {
        history.replaceState(null, "", `#mission-${m.id}`);
      }
      renderList();
      renderDetail(m);
    }

    function renderDetail(m) {
      const prereqHtml = (m.prerequisites || m.reqMissionIds || []).length
        ? (m.prerequisites || (m.reqMissionIds || []).map((id) => ({ id, title: null }))).map((p) =>
            `<span class="linkish" data-goto="${p.id}">#${p.id}${p.title ? " " + escapeHtml(p.title) : ""}</span>`
          ).join(" · ")
        : "None";

      const rewards = (m.rewards || []).map((r) =>
        `<span class="reward-pill">${labelCbid(r.itemCbid)}${r.quantity ? " ×" + r.quantity : ""}</span>`
      ).join("");

      const storyBlocks = [
        ["Description", m.description],
        ["Not complete", m.notCompleteText],
        ["Complete", m.completeText],
        ["Fail", m.failText],
      ].filter(([, t]) => t && String(t).trim());

      detailEl.innerHTML = `
        <div class="detail-inner">
          <h2 class="detail-title">${escapeHtml(m.title || m.name || ("Mission " + m.id))}</h2>
          <p class="detail-sub">#${m.id} · ${escapeHtml(m.name || "")}${m.internal ? " · " + escapeHtml(m.internal) : ""}</p>

          ${m.summaryFlow ? `<div class="summary-flow">${escapeHtml(m.summaryFlow)}</div>` : ""}

          <div class="section">
            <h3>Overview</h3>
            <div class="grid-kv">
              ${kv("Type", escapeHtml(m.type || "—"))}
              ${kv("Core", m.coreMission ? "yes" : "no")}
              ${kv("Giver", m.npcGiverCbid ? labelCbid(m.npcGiverCbid) : "—")}
              ${kv("Continent", m.continent != null ? labelCbid(m.continent) : "—")}
              ${kv("Level", m.reqLevelMin != null ? `${m.reqLevelMin} – ${m.reqLevelMax ?? "?"}` : "—")}
              ${kv("Race / Class", `${m.reqRace ?? "—"} / ${m.reqClass ?? "—"}`)}
              ${kv("Priority", m.priority != null ? escapeHtml(String(m.priority)) : "—")}
              ${kv("Repeatable", m.isRepeatable ? "yes" : "no")}
              ${kv("Target level", m.targetLevel != null ? escapeHtml(String(m.targetLevel)) : null)}
              ${kv("Region / Pocket", (m.region != null || m.pocket != null) ? `${m.region ?? "—"} / ${m.pocket ?? "—"}` : null)}
              ${kv("Ored / Negative", (m.requirementsOred != null || m.requirementsNegative != null) ? `${m.requirementsOred ?? 0} / ${m.requirementsNegative ?? 0}` : null)}
              ${m.wadMissing ? kv("WAD", '<span style="color:var(--warn)">not matched</span>') : ""}
            </div>
          </div>

          <div class="section">
            <h3>Prerequisites</h3>
            <div>${prereqHtml}</div>
          </div>

          ${rewards ? `<div class="section"><h3>Mission rewards (items)</h3><div class="rewards-row">${rewards}</div></div>` : ""}

          ${storyBlocks.length ? `<div class="section"><h3>Story</h3>${storyBlocks.map(([label, text]) =>
            `<div class="story"><span class="label">${escapeHtml(label)}</span>${renderMarkup(text)}</div>`
          ).join("")}</div>` : ""}

          <div class="section">
            <h3>Objective flow (${(m.objectives || []).length})</h3>
            <div class="flow">
              ${(m.objectives || []).map(renderObjective).join("") || '<div class="detail-empty">No objectives</div>'}
            </div>
          </div>
        </div>`;

      detailEl.querySelectorAll("[data-goto]").forEach((el) => {
        el.addEventListener("click", () => selectMission(Number(el.getAttribute("data-goto"))));
      });
    }

    function wireEvents() {
      for (const el of [searchEl, reqFilterEl, typeFilterEl, coreFilterEl, prereqFilterEl, levelFilterEl]) {
        el.addEventListener("input", applyFilters);
        el.addEventListener("change", applyFilters);
      }
      devToggleEl.addEventListener("click", () => {
        state.dev = !state.dev;
        document.body.classList.toggle("dev", state.dev);
        devToggleEl.classList.toggle("active", state.dev);
        if (state.selectedId != null) {
          const m = state.byId.get(state.selectedId);
          if (m) renderDetail(m);
        }
      });
      window.addEventListener("hashchange", () => {
        const m = location.hash.match(/^#mission-(\d+)/);
        if (m) selectMission(Number(m[1]), false);
      });
    }

    async function loadData() {
      try {
        let doc = EMBEDDED_DATA;
        if (!doc) {
          statusEl.textContent = "Fetching missions.json...";
          const res = await fetch("missions.json");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          doc = await res.json();
        }
        state.doc = doc;
        state.missions = doc.missions || [];
        state.names = doc.names || {};
        state.byId = new Map(state.missions.map((m) => [m.id, m]));
        renderMeta(doc);
        populateFilters(state.missions);
        applyFilters();
        wireEvents();
        const hash = location.hash.match(/^#mission-(\d+)/);
        if (hash) {
          selectMission(Number(hash[1]), false);
        } else if (state.filtered.length) {
          selectMission(state.filtered[0].id, false);
        }
        statusEl.textContent = "";
      } catch (err) {
        statusEl.classList.add("error");
        statusEl.textContent = `Failed to load missions: ${err.message || err}`;
      }
    }

    loadData();
  </script>
</body>
</html>
